<!DOCTYPE html>
<html lang="en">
<style>
    *{
        -ms-overflow-style: none;
        /* IE and Edge */
        scrollbar-width: none;
        /* Firefox */

        outline: none;
    }
    html {
        height: 100%;
    }

    body {
        margin: 0;
        background-color: #9e9e9e;
        background-image: url('logostacked-black.png');
        background-position: center;
        background-repeat: no-repeat;
        background-size: initial;
        background-attachment: fixed;
        height: 100%;
    }

    .flexcontainer {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-evenly;
        align-items: center;
        height: 100%;
    }

    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        width: 200px;
        /* background-color: #9e9e9e; */
    }

    li a {
        display: block;
        padding: 10px;
        /* margin: 10px; */
        text-decoration: none;
        color: #ffffff;
        text-align: center;

    }

    li a.selected {
        color: white;
        background-color: #000000;
        border-radius: 10px;
        text-shadow: 3px 3px 5px #00FF00;
    }

    .scrolling_list {
        max-height: 360px;
        overflow-y: auto;
        width: 25%;
    }

</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<script src="games.js"></script>

<body>
    <!-- <div id="flex-container"> -->
    <div class="flexcontainer">
        <img id="gameimage" class="thumbnail" width="480" height="360">

        <div class="scrolling_list">
            <ul id="fileLinks">

            </ul>
        </div>



    </div>

    <!-- Assuming the JavaScript file is named script.js -->
    <script src="script.js"></script>

    <!-- </div> -->


</body>

</html>
