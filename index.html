<!DOCTYPE html>
<html lang="en">
<style>
    * {
        -ms-overflow-style: none;
        /* IE and Edge */
        scrollbar-width: none;
        /* Firefox */

        outline: none;
    }

    html {
        height: 100%;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
        margin: 0;
        background-color: #333333;
        /* background-image: url('logostacked-black.png'); */
        background-position: center;
        background-repeat: no-repeat;
        background-size: initial;
        background-attachment: fixed;
        height: 100%;
    }

    .flexcontainer {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-evenly;
        /* align-items: center;
        height: 80%;*/
    }

    ul {
        list-style-type: none;
        margin: auto;
        padding: 0;
        /*width: 250px;*/
        border-radius: 10px;
        background-color: #6a6a6a;
        font-size: 20px;
    }

    li a {
        display: block;
        padding: 10px;
        text-decoration: none;
        color: #ffffff;
        text-align: center;
        border-radius: 10px;

    }

    li a.selected {
        color: white;
        background-color: #272626;
        border-radius: 10px;
        text-shadow: 3px 3px 5px #00FF00;
    } 

    .scrolling_list {

        max-height: 360px;
        overflow-y: auto;
        width: 480px;
        border-radius: 10px;

    }

    .logo_div {
        height: 30%;
        width: 100%;
        border-radius: 10px;
    }

    .logo_div img {
        display: block;
        margin: auto;
        padding-top: 2%;
        width: auto;
        height: 75%;
    }
    .thumbnail{
        border-radius: 10px;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<script src="games.js"></script>

<body>
    <!-- <div id="flex-container"> -->
    <div class="logo_div">
        <img src="logostacked-white-shadow.png">
    </div>
    <div class="flexcontainer">

        <div class="thumbnail_div">
            <img id="gameimage" class="thumbnail" width="480" height="360">
        </div>


        <div class="scrolling_list">
            <ul id="fileLinks">

            </ul>
        </div>



    </div>

    <!-- Assuming the JavaScript file is named script.js -->
    <script src="script.js"></script>

    <!-- </div> -->


</body>

</html>
